name: Trigger auto deployment for testdemoapp

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ develop ]
    paths:
    - '**'
    - '.github/workflows/testdemoapp-AutoDeployTrigger-00e3ba26-1847-49e5-bba9-fffc845f38ce.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.TESTDEMOAPP_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.TESTDEMOAPP_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.TESTDEMOAPP_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          registryUrl: 
          registryUsername: ${{ secrets.TESTDEMOAPP_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.TESTDEMOAPP_REGISTRY_PASSWORD }}
          containerAppName: testdemoapp
          resourceGroup: test-container-app-RG
          imageToBuild: default/[parameters('containerAppName')]:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


